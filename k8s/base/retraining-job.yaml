apiVersion: batch/v1
kind: Job
metadata:
  name: aml-retraining-manual
  namespace: aml-monitoring
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: retrain
          image: ghcr.io/replace-org/aml-backend:latest
          command: ["python", "-m", "aml_monitoring.cli", "retrain"]
          envFrom:
            - configMapRef:
                name: aml-config
  backoffLimit: 1
