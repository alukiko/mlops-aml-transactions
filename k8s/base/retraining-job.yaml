apiVersion: batch/v1
kind: Job
metadata:
  name: aml-retraining-manual
  namespace: aml-monitoring
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: retrain
          image: ghcr.io/alukiko/mlops-aml-transactions/aml-backend:47dfc37847450343f7c3e11445347cd1f2c048f7
          command: ["python", "-m", "aml_monitoring.cli", "retrain"]
          envFrom:
            - configMapRef:
                name: aml-config
            - secretRef:
                name: aml-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: runtime
              mountPath: /app/runtime
              subPath: runtime
            - name: runtime
              mountPath: /app/mlartifacts
              subPath: mlartifacts
            - name: runtime
              mountPath: /app/models
              subPath: models
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aml-data-pvc
        - name: runtime
          persistentVolumeClaim:
            claimName: aml-runtime-pvc
  backoffLimit: 1
