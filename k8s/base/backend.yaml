apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-backend
  namespace: aml-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aml-backend
  template:
    metadata:
      labels:
        app: aml-backend
    spec:
      initContainers:
        - name: sync-data
          image: ghcr.io/alukiko/mlops-aml-transactions/aml-backend:152a27289ff7bd019ec3e150971ddad3228e03da
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              mkdir -p /shared/runtime /shared/reports /shared/mlartifacts /shared/models
              cp -f /app/models/* /shared/models/ 2>/dev/null || true
              if [ -n "$AWS_ACCESS_KEY_ID" ] && [ "$AWS_ACCESS_KEY_ID" != "replace-me" ]; then
                python -m aml_monitoring.s3_data download --required
                rm -f /app/models/*.pkl
                python -m aml_monitoring.s3_data models-download --required
                cp -f /app/models/* /shared/models/
              else
                echo "S3 credentials are not configured; using image model artifacts"
              fi
          envFrom:
            - configMapRef:
                name: aml-config
            - secretRef:
                name: aml-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: runtime
              mountPath: /shared
      containers:
        - name: backend
          image: ghcr.io/alukiko/mlops-aml-transactions/aml-backend:152a27289ff7bd019ec3e150971ddad3228e03da
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: aml-config
            - secretRef:
                name: aml-secrets
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: runtime
              mountPath: /app/runtime
              subPath: runtime
            - name: runtime
              mountPath: /app/reports
              subPath: reports
            - name: runtime
              mountPath: /app/mlartifacts
              subPath: mlartifacts
            - name: runtime
              mountPath: /app/models
              subPath: models
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aml-data-pvc
        - name: runtime
          persistentVolumeClaim:
            claimName: aml-runtime-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aml-backend
  namespace: aml-monitoring
spec:
  selector:
    app: aml-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
