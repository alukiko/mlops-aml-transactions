apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-frontend
  namespace: aml-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aml-frontend
  template:
    metadata:
      labels:
        app: aml-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/alukiko/mlops-aml-transactions/aml-frontend:2e3e2df8239c4fbd6750ade73b057e9dd0ce020e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aml-frontend
  namespace: aml-monitoring
spec:
  type: LoadBalancer
  selector:
    app: aml-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
