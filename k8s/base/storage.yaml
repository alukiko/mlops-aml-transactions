apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aml-data-pvc
  namespace: aml-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aml-runtime-pvc
  namespace: aml-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
