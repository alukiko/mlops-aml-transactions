apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aml-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: aml-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["aml-backend:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aml-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aml-monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: aml-monitoring
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: AML Monitoring
        orgId: 1
        folder: AML
        type: file
        options:
          path: /var/lib/grafana/dashboards
  aml-monitoring.json: |
    {
      "uid": "aml-monitoring",
      "title": "AML Monitoring",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "panels": [
        {"type":"stat","title":"API Requests","gridPos":{"x":0,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(aml_api_requests_total)","refId":"A"}]},
        {"type":"stat","title":"Predictions","gridPos":{"x":4,"y":0,"w":4,"h":4},"targets":[{"expr":"sum(aml_predictions_total)","refId":"A"}]},
        {"type":"gauge","title":"Anomaly Rate","gridPos":{"x":8,"y":0,"w":4,"h":4},"targets":[{"expr":"aml_anomaly_rate","refId":"A"}]},
        {"type":"gauge","title":"Avg Laundering Probability","gridPos":{"x":12,"y":0,"w":4,"h":4},"targets":[{"expr":"aml_average_laundering_probability","refId":"A"}]},
        {"type":"stat","title":"Model Threshold","gridPos":{"x":16,"y":0,"w":4,"h":4},"targets":[{"expr":"aml_model_threshold","refId":"A"}]},
        {"type":"stat","title":"Retraining Status","gridPos":{"x":20,"y":0,"w":4,"h":4},"targets":[{"expr":"aml_retraining_status","refId":"A"}]},
        {"type":"timeseries","title":"API Request Rate by Endpoint","gridPos":{"x":0,"y":4,"w":12,"h":8},"targets":[{"expr":"sum(rate(aml_api_requests_total[5m])) by (path, status)","refId":"A","legendFormat":"{{path}} {{status}}"}]},
        {"type":"timeseries","title":"Request Latency p95 by Endpoint","gridPos":{"x":12,"y":4,"w":12,"h":8},"targets":[{"expr":"histogram_quantile(0.95, sum(rate(aml_api_request_latency_seconds_bucket[5m])) by (le, path))","refId":"A","legendFormat":"{{path}}"}]},
        {"type":"timeseries","title":"Model Quality","gridPos":{"x":0,"y":12,"w":12,"h":8},"targets":[{"expr":"aml_model_roc_auc","refId":"A","legendFormat":"ROC-AUC"},{"expr":"aml_model_pr_auc","refId":"B","legendFormat":"PR-AUC"},{"expr":"aml_model_precision","refId":"C","legendFormat":"Precision"},{"expr":"aml_model_recall","refId":"D","legendFormat":"Recall"},{"expr":"aml_model_f1","refId":"E","legendFormat":"F1"},{"expr":"aml_model_f2","refId":"F","legendFormat":"F2"}]},
        {"type":"bargauge","title":"Prediction Classes","gridPos":{"x":12,"y":12,"w":6,"h":8},"targets":[{"expr":"sum(aml_predictions_total) by (predicted_class)","refId":"A","legendFormat":"class {{predicted_class}}"}]},
        {"type":"stat","title":"Training Data","gridPos":{"x":18,"y":12,"w":6,"h":8},"targets":[{"expr":"aml_model_train_rows","refId":"A","legendFormat":"rows"},{"expr":"aml_model_train_positives","refId":"B","legendFormat":"positives"}]},
        {"type":"timeseries","title":"Drift Scores","gridPos":{"x":0,"y":20,"w":12,"h":8},"targets":[{"expr":"aml_data_drift_score","refId":"A","legendFormat":"data"},{"expr":"aml_target_drift_score","refId":"B","legendFormat":"target"},{"expr":"aml_concept_drift_score","refId":"C","legendFormat":"concept"}]},
        {"type":"timeseries","title":"API Errors","gridPos":{"x":12,"y":20,"w":12,"h":8},"targets":[{"expr":"sum(rate(aml_api_requests_total{status!~\"2..\"}[5m])) by (path, status)","refId":"A","legendFormat":"{{path}} {{status}}"}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: aml-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: grafana-provisioning
              mountPath: /var/lib/grafana/dashboards/aml-monitoring.json
              subPath: aml-monitoring.json
      volumes:
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: aml-monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
