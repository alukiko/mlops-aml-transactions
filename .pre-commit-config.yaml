--- 
repos:

-
  repo: https://github.com/ambv/black
  rev: 20.8b1
  hooks: 
    - 
      id: black
      language_version: python3

-   repo: local
    hooks:
    -   id: conventional-commit
        name: conventional commit message
        entry: python scripts/check_conventional_commits.py --message-file
        language: system
        stages: [commit-msg]
    -   id: python-tests
        name: pytests
        entry: pytest src/tests
        language: python
        additional_dependencies: [pre-commit, pytest, pandas, scikit-learn, numpy, fastapi, prometheus-client]
        always_run: true
        pass_filenames: false
