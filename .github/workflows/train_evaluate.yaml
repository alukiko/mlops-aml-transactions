name: model-training-evaluate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest src/tests -q

      - name: Generate model evaluation report
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          {
            echo "# Model evaluation"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tests: passed"
            echo "- Runtime data/model artifacts are intentionally not stored in Git."
            echo
            echo "Production metrics are logged by retraining jobs to MLflow and exposed to Prometheus/Grafana."
          } > model-evaluation-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-report
          path: model-evaluation-report.md
