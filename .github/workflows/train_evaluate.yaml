name: model-training-evaluate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download training data from S3
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'mlops-aml-transactions' }}
          S3_DATA_PREFIX: ${{ secrets.S3_DATA_PREFIX || 'data/raw' }}
        run: |
          echo "S3_ENDPOINT_URL=${S3_ENDPOINT_URL}"
          echo "S3_BUCKET=${S3_BUCKET}"
          echo "S3_DATA_PREFIX=${S3_DATA_PREFIX}"
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "⚠️ AWS_ACCESS_KEY_ID not set — skipping S3 data download (unit tests will run without training data)"
            exit 0
          fi
          python -m aml_monitoring.s3_data check
          python -m aml_monitoring.s3_data download --required

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest src/tests -q

      - name: Generate model evaluation report
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          {
            echo "# Model evaluation"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tests: passed"
            echo "- Runtime data/model artifacts are intentionally not stored in Git."
            echo
            echo "Production metrics are logged by retraining jobs to MLflow and exposed to Prometheus/Grafana."
          } > model-evaluation-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-report
          path: model-evaluation-report.md
