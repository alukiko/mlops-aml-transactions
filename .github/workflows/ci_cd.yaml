name: CI CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/aml-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/aml-frontend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "cookiecutter>=2.6,<3"
      - name: Lint backend
        run: ruff check src mlops_aml_transactions tests scripts
      - name: Test backend
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: pytest src/tests tests
      - name: Validate Cookiecutter template
        run: |
          cookiecutter . --no-input --output-dir /tmp/cookiecutter-smoke
          PYTHONPATH=/tmp/cookiecutter-smoke/mlops-aml-transactions/src \
            pytest /tmp/cookiecutter-smoke/mlops-aml-transactions/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-images:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name == 'push'
        with:
          python-version: "3.11"
      - name: Download production model artifacts
        if: github.event_name == 'push'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL || 'https://storage.yandexcloud.net' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'mlops-aml-transactions' }}
          S3_MODELS_PREFIX: ${{ secrets.S3_MODELS_PREFIX || 'models' }}
          MODEL_FILENAME: hgb_compat.pkl
        run: |
          pip install boto3
          python -m aml_monitoring.s3_data models-download --required
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tags in k8s manifests
        run: |
          sed -i "s|aml-backend:[a-zA-Z0-9._-]*|aml-backend:${{ github.sha }}|g" k8s/base/backend.yaml
          sed -i "s|aml-frontend:[a-zA-Z0-9._-]*|aml-frontend:${{ github.sha }}|g" k8s/base/frontend.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add k8s/base/backend.yaml k8s/base/frontend.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]"
          git push

  deploy-argocd:
    runs-on: ubuntu-latest
    needs: update-manifests
    if: github.event_name == 'push' && vars.ENABLE_ARGOCD_DEPLOY == 'true'
    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd
      - name: Sync Argo CD application
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_APP: ${{ secrets.ARGOCD_APP }}
        run: |
          test -n "$ARGOCD_SERVER"
          test -n "$ARGOCD_AUTH_TOKEN"
          argocd app sync "${ARGOCD_APP:-aml-monitoring}" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
          argocd app wait "${ARGOCD_APP:-aml-monitoring}" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web --health --timeout 300
